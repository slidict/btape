version: 1

# wip parses compose.yml itself and drives wslc directly — no external
# compose-for-wslc binary needed. Prefer a real compose tool instead? Use
# mode: compose (see README "Compose mode") and set compose.command.
mode: compose-native

wslc:
  # optional; wslc binary/path wip shells out to ("auto" resolves it for you)
  command: auto

compose:
  # TODO: which service in compose.yml wip run/exec/NAME target
  service: app
  file: compose.yml
  project: btape

interaction:
  demo:
    type: run
    command: bundle exec btape examples/demo.tape
    container: app
  btape:
    type: run
    command: bundle exec btape
    container: app
